[project]
name = "axon-hub"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["*.md"]  # the spec holds code samples that are not ours to reformat

[tool.ruff.lint.per-file-ignores]
"scripts/make_injection_corpus.py" = ["E501"]  # data tables

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
